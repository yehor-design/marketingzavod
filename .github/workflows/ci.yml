name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Types, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: GTM container is up to date
        run: npm run gtm:build && git diff --exit-code gtm/container.json

  e2e:
    name: End-to-end tests (${{ matrix.edition }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [jet, bg]
    env:
      NEXT_PUBLIC_SITE_EDITION: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=${{ matrix.edition }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.edition }}
          path: playwright-report
          retention-days: 7

  visual:
    name: Visual regression (jet)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_EDITION: jet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-regression-diffs
          path: |
            playwright-visual-report
            test-results/visual
          retention-days: 7

  lighthouse:
    name: Lighthouse budget (${{ matrix.edition }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [jet, bg]
    env:
      NEXT_PUBLIC_SITE_EDITION: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: npm
      - run: npm ci
      - run: npm run build
      # Budget breaches are warnings: the job reports them and stays green.
      # Bulgarian Lighthouse URLs will be added once Bulgarian pages exist.
      - if: matrix.edition == 'jet'
        run: npm run lighthouse
      - name: Summary
        if: always() && matrix.edition == 'jet'
        run: node scripts/lighthouse-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && matrix.edition == 'jet'
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 14
